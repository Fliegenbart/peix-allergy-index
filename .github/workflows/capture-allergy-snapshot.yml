name: Capture allergy forecast snapshot

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify model code
        run: npm test

      - name: Capture public-source forecast snapshot
        run: node scripts/capture-snapshot.js --output-dir data/snapshots

      - name: Commit snapshot when changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Capture daily allergy forecast snapshot"
          file_pattern: data/snapshots/*.json
